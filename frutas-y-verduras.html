<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FrutiShop - Tu tienda de frutas</title>
    <style>
        /* RESET Y ESTILOS GENERALES */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; }
        body { background-color: #f5f5f5; display: flex; justify-content: center; min-height: 100vh; }
        
        /* CONTENEDOR PRINCIPAL SIMULANDO MÓVIL */
        #app-container {
            width: 100%;
            max-width: 420px;
            background-color: #f9f9f9;
            min-height: 100vh;
            position: relative;
        }

        /* HEADER Y BARRA DE BÚSQUEDA */
        .header {
            background-color: #FF6B6B;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-icon { color: white; font-size: 24px; cursor: pointer; padding: 0 5px; }
        .search-input-wrapper {
            flex: 1;
            margin: 0 10px;
        }
        .search-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            outline: none;
            font-size: 14px;
            background: #fff;
            color: #333;
        }
        .search-input::placeholder { color: #999; }

        /* TÍTULO DE SECCIÓN */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }
        .section-title { font-size: 18px; font-weight: 700; color: #222; }
        .grid-icon { font-size: 20px; cursor: pointer; }

        /* GRID DE PRODUCTOS */
        #product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 15px 20px 15px;
        }

        /* TARJETA DE PRODUCTO */
        .product-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
        }
        .heart-icon {
            position: absolute;
            top: 12px;
            left: 12px;
            color: #dc3545;
            font-size: 18px;
            cursor: pointer;
        }
        .product-image {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin: 10px 0;
        }
        .product-name {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            align-self: flex-start;
            margin-bottom: 8px;
        }
        .card-footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price { font-weight: 700; color: #444; font-size: 16px; }
        .btn-comprar {
            background-color: #FFB300; /* Naranja */
            color: white;
            font-weight: bold;
            font-size: 12px;
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-comprar:active { opacity: 0.8; }

        /* DARK OVERLAY DEL MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none; /* Oculto por defecto */
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        /* CONTENEDOR DEL MODAL */
        .modal-box {
            background: white;
            width: 85%;
            max-width: 320px;
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 5px; color: #333; }
        .modal-product-name { font-size: 16px; color: #666; margin-bottom: 20px; }

        /* SELECTOR DE CANTIDAD */
        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .qty-btn {
            width: 35px; height: 35px;
            background: #f0f0f0;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .qty-btn:active { background: #ddd; }
        .qty-number {
            font-size: 20px;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        /* ACCIONES DEL MODAL */
        .modal-actions { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .btn-confirm {
            background-color: #FF6B6B;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        .btn-confirm:active { opacity: 0.8; }
        .btn-cancel {
            background: transparent;
            border: none;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            padding: 5px;
            text-decoration: underline;
        }

        /* MENSAJE CUANDO NO HAY RESULTADOS */
        .empty-state {
            grid-column: span 2;
            text-align: center;
            padding: 40px 0;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- HEADER -->
        <div class="header">
            <span class="header-icon">←</span>
            <div class="search-input-wrapper">
                <input type="text" id="search-input" class="search-input" placeholder="Search Groceries Item">
            </div>
            <span class="header-icon">🛒</span>
        </div>

        <!-- TÍTULO -->
        <div class="section-header">
            <span class="section-title">Fruits & Vegetables</span>
            <span class="grid-icon">▦</span>
        </div>

        <!-- CONTENEDOR DE PRODUCTOS -->
        <div id="product-grid"></div>
    </div>

    <!-- MODAL POPUP DE COMPRA -->
    <div class="modal-overlay" id="purchase-modal">
        <div class="modal-box">
            <h3 class="modal-title">Seleccionar Cantidad</h3>
            <p class="modal-product-name" id="modal-product-name">Producto</p>
            
            <div class="quantity-selector">
                <button class="qty-btn" id="btn-decrement">-</button>
                <span class="qty-number" id="modal-quantity">1</span>
                <button class="qty-btn" id="btn-increment">+</button>
            </div>

            <div class="modal-actions">
                <button class="btn-confirm" id="btn-confirm-purchase">Confirmar Compra</button>
                <button class="btn-cancel" id="btn-close-modal">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // 1. BASE DE DATOS DE PRODUCTOS (Simulación con imágenes de stock gratuitas)
        const products = [
            { id: 1, name: 'Kiwi Fruits', price: 160, image: 'https://images.unsplash.com/photo-1585059895524-0a78f916b202?w=200&h=200&fit=crop' },
            { id: 2, name: 'Apple', price: 75, image: 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=200&h=200&fit=crop' },
            { id: 3, name: 'Tomato', price: 25, image: 'https://images.unsplash.com/photo-1592924357228-91a078e5c814?w=200&h=200&fit=crop' },
            { id: 4, name: 'Lemon', price: 48, image: 'https://images.unsplash.com/photo-1586281380349-632531f09622?w=200&h=200&fit=crop' },
            { id: 5, name: 'Pineapple', price: 120, image: 'https://images.unsplash.com/photo-1550989460-0adf9ea622e2?w=200&h=200&fit=crop' },
            { id: 6, name: 'Watermelon', price: 85, image: 'https://images.unsplash.com/photo-1589984662646-e7b2e4962f18?w=200&h=200&fit=crop' }
        ];

        // 2. VARIABLES DE ESTADO
        let currentProduct = null;
        let currentQuantity = 1;

        // 3. ELEMENTOS DEL DOM
        const grid = document.getElementById('product-grid');
        const searchInput = document.getElementById('search-input');
        const modal = document.getElementById('purchase-modal');
        const modalProductName = document.getElementById('modal-product-name');
        const modalQuantity = document.getElementById('modal-quantity');
        const btnConfirm = document.getElementById('btn-confirm-purchase');
        const btnClose = document.getElementById('btn-close-modal');
        const btnInc = document.getElementById('btn-increment');
        const btnDec = document.getElementById('btn-decrement');

        // 4. FUNCIÓN PARA RENDERIZAR LOS PRODUCTOS
        function renderProducts(filteredData) {
            grid.innerHTML = ''; // Limpiar el grid
            
            if (filteredData.length === 0) {
                grid.innerHTML = `<div class="empty-state">No se encontraron productos 😞</div>`;
                return;
            }

            filteredData.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <span class="heart-icon">♡</span>
                    <img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.src='https://via.placeholder.com/100?text=Producto'">
                    <span class="product-name">${product.name}</span>
                    <div class="card-footer">
                        <span class="price">₹ ${product.price}</span>
                        <button class="btn-comprar" data-id="${product.id}">COMPRAR</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            // Adjuntar eventos a los botones "COMPRAR"
            document.querySelectorAll('.btn-comprar').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    const product = products.find(p => p.id === id);
                    openPurchaseModal(product);
                });
            });
        }

        // 5. LÓGICA DE BÚSQUEDA
        searchInput.addEventListener('input', function() {
            const text = this.value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(text));
            renderProducts(filtered);
        });

        // 6. LÓGICA DEL MODAL (Abrir, Cerrar y Cantidades)
        function openPurchaseModal(product) {
            currentProduct = product;
            currentQuantity = 1;
            modalProductName.textContent = product.name;
            modalQuantity.textContent = currentQuantity;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            currentProduct = null;
        }

        // Cerrar haciendo clic en el fondo oscuro
        modal.addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        btnClose.addEventListener('click', closeModal);

        // Incrementar cantidad
        btnInc.addEventListener('click', function() {
            currentQuantity++;
            modalQuantity.textContent = currentQuantity;
        });

        // Decrementar cantidad (mínimo 1)
        btnDec.addEventListener('click', function() {
            if (currentQuantity > 1) {
                currentQuantity--;
                modalQuantity.textContent = currentQuantity;
            }
        });

        // 7. CONFIRMAR COMPRA (Simulación)
        btnConfirm.addEventListener('click', function() {
            if (currentProduct) {
                const totalPrice = currentProduct.price * currentQuantity;
                alert(`¡Compra exitosa!\nHas agregado ${currentQuantity} ${currentProduct.name}(s) a tu carrito.\nTotal a pagar: ₹ ${totalPrice}`);
                closeModal();
            }
        });

        // 8. INICIALIZAR LA APP CARGANDO TODOS LOS PRODUCTOS
        renderProducts(products);
    </script>
</body>
</html>
