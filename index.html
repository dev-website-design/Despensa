<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Hogar PWA</title>
  <link rel="manifest" href="assets/manifest.json">
  <link rel="stylesheet" href="assets/styles.css">
  <meta name="theme-color" content="#2d6a4f">
</head>
<body>
  <header>
    <h1>Nuestro Hogar</h1>
    <div class="header-actions">
      <button id="btn-instalar" class="install-btn hidden">📲 Instalar</button>
      <!-- Agregado id="btn-abrir-modal" y removido onclick -->
      <button id="btn-abrir-modal" class="add-btn">+</button>
    </div>
  </header>

  <main>
    <section id="categorias" class="grid-container">
      <!-- Las categorías se cargarán desde app.js -->
    </section>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2>Agregar Nueva Categoría</h2>
      <form id="form-categoria">
        <label for="nombre-categoria">Nombre:</label>
        <input type="text" id="nombre-categoria" placeholder="Ej: Oficina" required>
        
        <label for="imagen-categoria">Imagen (URL u opcional):</label>
        <input type="text" id="imagen-categoria" placeholder="Ej: https://example.com/icon.png">
        
        <div class="modal-buttons">
          <button type="submit" class="btn-primary">Agregar</button>
          <!-- Agregado id="btn-cerrar-modal" y removido onclick -->
          <button type="button" id="btn-cerrar-modal" class="btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
