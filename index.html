<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Findora - Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f0f2f5;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .mobile-card {
      width: 100%;
      max-width: 390px;
      height: 780px;
      background-color: #ffffff;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .hero-section {
      position: relative;
      height: 58%;
      background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .hero-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.15); }
    .brand-container { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
    .logo-circle {
      width: 75px; height: 75px; background-color: #ffffff; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); margin-bottom: 12px; padding: 8px;
    }
    .logo-circle svg { width: 28px; height: 28px; fill: #1a1a1a; margin-bottom: 2px; }
    .logo-circle span { font-size: 5px; font-weight: 800; color: #1a1a1a; letter-spacing: 0.5px; text-transform: uppercase; }
    .brand-name { color: #ffffff; font-size: 26px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; }
    .brand-subtitle { color: #ffffff; font-size: 14px; font-weight: 500; margin-top: 2px; }
    .curve-divider { position: absolute; bottom: -1px; left: 0; width: 100%; height: 70px; z-index: 2; }
    .content-section {
      height: 42%; background-color: #ffffff; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; padding: 10px 30px 40px 30px;
      text-align: center; z-index: 3;
    }
    .welcome-title { font-size: 28px; font-weight: 800; color: #2b2b2b; text-transform: uppercase; }
    .description { font-size: 13.5px; color: #7d7d7d; line-height: 1.5; font-weight: 500; }
    .buttons-container { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .btn { width: 100%; padding: 15px 0; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; }
    .btn-login { background-color: #1a1a1a; color: #ffffff; }
    .btn-signup { background-color: transparent; color: #1a1a1a; border: 1px solid #e0e0e0; }
  </style>
</head>
<body>

  <div class="mobile-card">
    <div class="hero-section">
      <div class="hero-overlay"></div>
      <div class="brand-container">
        <div class="logo-circle">
          <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07L19.07 4.93" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          <span>Findora</span>
          <span>Dream House</span>
        </div>
        <h1 class="brand-name">FINDORA</h1>
        <p class="brand-subtitle">Dream House</p>
      </div>
      <svg class="curve-divider" viewBox="0 0 500 80" preserveAspectRatio="none">
        <path d="M 0,80 Q 250,-20 500,80 L 500,80 L 0,80 Z" fill="#ffffff"></path>
      </svg>
    </div>

    <div class="content-section">
      <div>
        <h2 class="welcome-title">WELCOME</h2>
        <p class="description">Find your next space, feel at home<br>Where comfort meets convenience</p>
      </div>

      <div class="buttons-container">
        <button class="btn btn-login" onclick="window.location.href='perfil.html'">Login</button>
        <button class="btn btn-signup">Sign Up</button>
      </div>
    </div>
  </div>

</body>
</html>
