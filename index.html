<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FINDORA · Bienvenida</title>
    <style>
        /* Reseteo para que no haya bordes ni scroll en el móvil */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Kiltier', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Componente a Pantalla Completa */
        .hero-slider-component {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: white;
            background-color: #2A0C1B; /* Color Cherry de la app */
        }

        /* Imagen de fondo (Una imagen de cocina/despensa acorde al tema) */
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1556911220-e15b29be8c8f?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Capa oscura para legibilidad del texto */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(42, 12, 27, 0.4) 0%, rgba(42, 12, 27, 0.8) 100%);
            z-index: 2;
        }

        /* Contenido distribuido en el móvil */
        .hero-content {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            padding: 40px 24px 40px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header: Logo arriba a la izquierda */
        .hero-header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-top: 10px;
        }
        .hero-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 1px;
        }
        .logo-icon {
            width: 24px;
            height: 24px;
            background: var(--perfect-rose, #BE2C55);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 14px;
        }

        /* Texto en el centro */
        .hero-text-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-bottom: 20px;
        }
        .hero-title {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -1px;
            text-transform: uppercase;
            margin: 0;
        }
        .hero-subtitle {
            margin-top: 30px;
            font-size: 16px;
            line-height: 1.5;
            max-width: 90%;
            font-weight: 400;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            color: #FFE0EB;
        }

        /* Botón Deslizante */
        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 62px;
            background-color: white;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            user-select: none;
            touch-action: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .slider-text {
            color: #333;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.5px;
            z-index: 2;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .slider-knob {
            position: absolute;
            left: 4px;
            right: auto;
            top: 4px;
            width: 54px;
            height: 54px;
            background-color: #2A0C1B; /* Cherry de la app */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 3;
            transition: box-shadow 0.2s ease, background-color 0.3s ease;
        }
        .slider-knob:active {
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .slider-knob svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        @media (max-height: 700px) {
            .hero-title { font-size: 36px; }
            .hero-subtitle { font-size: 14px; margin-top: 20px; }
            .hero-content { padding: 20px 20px 20px 20px; }
            .slider-wrapper { height: 56px; }
            .slider-knob { width: 48px; height: 48px; }
        }
    </style>
</head>
<body>

    <!-- COMPONENTE INICIO DE APP -->
    <div class="hero-slider-component" id="sliderComponent">
        <div class="hero-bg"></div>
        <div class="hero-overlay"></div>
        
        <div class="hero-content">
            <div class="hero-header">
                <div class="hero-logo">
                    <div class="logo-icon">F</div>
                    FINDORA
                </div>
            </div>

            <div class="hero-text-area">
                <h1 class="hero-title">
                    TU<br>
                    DESPENSA
                </h1>
                <p class="hero-subtitle">
                    Organiza tus compras y mantén tu hogar en orden. El lugar perfecto para compartir con tu familia.
                </p>
            </div>

            <div class="slider-wrapper" id="sliderContainer">
                <span class="slider-text">Empezar</span>
                <div class="slider-knob" id="sliderKnob">
                    <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const knob = document.getElementById('sliderKnob');
            const container = document.getElementById('sliderContainer');
            const sliderText = container.querySelector('.slider-text');
            let isDragging = false;

            const onStart = (e) => {
                isDragging = true;
                knob.style.transition = 'none';
                const rect = container.getBoundingClientRect();
                const currentLeft = knob.getBoundingClientRect().left - rect.left;
                knob.style.left = currentLeft + 'px';
                knob.style.right = 'auto';
            };

            const onMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const rect = container.getBoundingClientRect();
                let newLeft = clientX - rect.left - (knob.offsetWidth / 2);
                const maxLeft = container.offsetWidth - knob.offsetWidth - 4;
                const minLeft = 4;
                if (newLeft < minLeft) newLeft = minLeft;
                if (newLeft > maxLeft) newLeft = maxLeft;
                knob.style.left = newLeft + 'px';
            };

            const onEnd = (e) => {
                if (!isDragging) return;
                isDragging = false;

                const knobRect = knob.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                const knobLeft = knobRect.left - containerRect.left;
                const threshold = containerRect.width * 0.85;

                if (knobLeft > threshold) {
                    // 1. Acción completada: El botón y la barra cambian a rosa (color de la app)
                    knob.style.transition = 'all 0.3s ease';
                    knob.style.backgroundColor = '#BE2C55'; // Perfect Rose
                    
                    container.style.backgroundColor = '#BE2C55';
                    sliderText.style.color = 'white';
                    sliderText.textContent = '¡Listo!';

                    // 🔥 AQUÍ OCURRE LA MAGIA: Redirige al login de FINDORA
                    setTimeout(() => {
                        window.location.href = 'app.html';
                    }, 500); 
                    
                } else {
                    // Si no se completa, el botón rebota a la izquierda
                    knob.style.transition = 'all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55)';
                    knob.style.left = '4px';
                    knob.style.right = 'auto';
                    
                    container.style.backgroundColor = 'white';
                    sliderText.style.color = '#333';
                    sliderText.textContent = 'Empezar';
                }
            };

            // Eventos para Mouse
            knob.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);

            // Eventos para Touch (Móvil)
            knob.addEventListener('touchstart', onStart, { passive: false });
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);
        });
    </script>
</body>
</html>
