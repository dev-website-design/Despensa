<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Despensa PWA</title>
  <link rel="manifest" href="assets/manifest.json">
  <link rel="stylesheet" href="assets/styles.css">
  <meta name="theme-color" content="#2d6a4f">
</head>
<body>
  <header>
    <h1>Mi Despensa</h1>
    <div class="header-actions">
      <!-- Botón para instalar la PWA (se muestra cuando el navegador lo permite) -->
      <button id="btn-instalar" class="install-btn hidden">📲 Instalar</button>
      <button class="add-btn" onclick="mostrarModal()">+</button>
    </div>
  </header>

  <main>
    <section id="categorias" class="grid-container">
      <div class="categoria"><span>Cocina</span></div>
      <div class="categoria"><span>Habitación</span></div>
      <div class="categoria"><span>Baño</span></div>
      <div class="categoria"><span>Sala</span></div>
      <div class="categoria"><span>Comedor</span></div>
    </section>
  </main>

  <!-- Modal para agregar nueva categoría -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2>Agregar Nueva Categoría</h2>
      <form id="form-categoria">
        <label for="nombre-categoria">Nombre:</label>
        <input type="text" id="nombre-categoria" placeholder="Ej: Oficina" required>
        
        <label for="imagen-categoria">Imagen (URL u opcional):</label>
        <input type="text" id="imagen-categoria" placeholder="Ej: https://example.com/icon.png">
        
        <div class="modal-buttons">
          <button type="submit" class="btn-primary">Agregar</button>
          <button type="button" class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
