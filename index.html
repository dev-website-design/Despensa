<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FINDORA · Dream House</title>
  <meta name="description" content="Encuentra tu próximo espacio, siéntete como en casa. FINDORA - donde la comodidad se encuentra con la conveniencia.">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .landing-hero {
      background-image: url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1000&q=80');
      background-size: cover; background-position: center;
      border-radius: 32px; padding: 40px 24px; min-height: 55vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative; margin-bottom: 24px;
    }
    .landing-hero::after {
      content: ''; position: absolute; inset: 0;
      background: rgba(42, 12, 27, 0.35); border-radius: 32px; z-index: 1;
    }
    .landing-hero *:not(.logo-badge) { position: relative; z-index: 2; }
    .landing-hero .logo-badge {
      width: 80px; height: 80px; background: var(--white); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15); position: relative; z-index: 2;
    }
    .landing-hero .logo-badge span { font-size: 2.8rem; color: var(--black-cherry); font-weight: bold; }
    .landing-hero h1 { font-size: 2.8rem; margin: 0 0 4px 0; color: white; text-shadow: 0 2px 12px rgba(0,0,0,0.3); letter-spacing: 2px; }
    .landing-hero p { font-size: 1.1rem; color: rgba(255,255,255,0.9); text-shadow: 0 1px 8px rgba(0,0,0,0.3); margin: 0; }
    .landing-actions { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; margin: 24px auto 0; }
    .btn-primary-landing {
      background: var(--perfect-rose); color: white; border: none; padding: 16px;
      border-radius: 30px; font-family: var(--font-main); font-size: 1rem; font-weight: 600;
      cursor: pointer; text-decoration: none; text-align: center;
      transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 14px rgba(190, 44, 85, 0.3);
    }
    .btn-primary-landing:active { transform: scale(0.96); }
    .btn-secondary-landing {
      background: transparent; color: var(--black-cherry); border: 1.5px solid var(--card-border);
      padding: 16px; border-radius: 30px; font-family: var(--font-main); font-size: 1rem;
      font-weight: 600; cursor: pointer; text-decoration: none; text-align: center;
      transition: background 0.2s;
    }
    .btn-secondary-landing:active { background: var(--carousel-pink); }
    /* Ocultar dock en landing */
    .floating-dock.landing-dock { display: none; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="landing-hero">
      <div class="logo-badge"><span>✱</span></div>
      <h1>FINDORA</h1>
      <p>Dream House</p>
      <div class="landing-actions">
        <a href="perfil.html" class="btn-primary-landing">Iniciar Sesión</a>
        <a href="#" class="btn-secondary-landing" id="signupBtn">Registrarse</a>
      </div>
    </div>
    <div style="text-align: center; padding: 0 16px 20px;">
      <p style="color: var(--black-cherry); opacity: 0.7; font-size: 0.95rem; margin: 0;">
        Encuentra tu próximo espacio, siéntete como en casa<br>
        <span style="color: var(--perfect-rose);">Donde la comodidad se encuentra con la conveniencia</span>
      </p>
    </div>
  </div>

  <!-- DOCK OCULTO (solo para mantener estructura) -->
  <div class="floating-dock landing-dock" id="mainDock">
    <a href="index.html" class="dock-item active" aria-label="Inicio"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></a>
    <a href="categorias.html" class="dock-item" aria-label="Categorías"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
    <button class="dock-add-btn" aria-label="Añadir categoría" id="addCategoryBtn">+</button>
    <a href="configuracion.html" class="dock-item" aria-label="Configuración"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
    <a href="perfil.html" class="dock-item" aria-label="Perfil"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
  </div>

  <!-- Modal de registro (reutiliza el del CSS) -->
  <div id="modalOverlay" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <h2 id="modalTitle">Crear cuenta</h2>
      <form id="modalForm">
        <label for="modalInput">Nombre de usuario</label>
        <input type="text" id="modalInput" placeholder="Escribe tu nombre..." required>
        <div class="modal-buttons">
          <button type="button" class="btn-secondary" id="modalCancel">Cancelar</button>
          <button type="submit" class="btn-primary">Registrarse</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Lógica para registro y redirección
    const signupBtn = document.getElementById('signupBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalCancel = document.getElementById('modalCancel');
    const modalForm = document.getElementById('modalForm');

    signupBtn.addEventListener('click', (e) => { e.preventDefault(); modalOverlay.classList.remove('hidden'); });
    modalCancel.addEventListener('click', () => modalOverlay.classList.add('hidden'));
    modalForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('modalInput').value.trim();
      if (username) {
        // Guardar usuario y redirigir a perfil para seleccionar avatar
        localStorage.setItem('user', JSON.stringify({ name: username, loggedIn: true }));
        window.location.href = 'perfil.html';
      }
    });
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) modalOverlay.classList.add('hidden'); });
    // Si ya hay sesión, redirigir a categorías
    if (localStorage.getItem('usuarioActivo') || localStorage.getItem('user')) {
      // window.location.href = 'categorias.html'; // Opcional, descomentar si se quiere auto-login
    }
  </script>
</body>
</html>
