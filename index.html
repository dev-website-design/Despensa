<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Hogar PWA</title>

  <!-- Compatibilidad para iOS / Apple -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nuestro Hogar">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">

  <link rel="manifest" href="assets/manifest.json">
  <link rel="stylesheet" href="assets/styles.css">
  <meta name="theme-color" content="#2A0C1B">
</head>
<body>

  <main>
    <section id="categorias" class="grid-container">
      <!-- Carga dinámicamente desde Firebase -->
    </section>
  </main>

  <!-- BARRA NAVEGACIÓN INFERIOR (FIJA) -->
  <nav class="bottom-bar">
    <div class="bottom-actions">
      <button id="btn-instalar" class="install-btn hidden">📲 Instalar</button>
      <button id="btn-abrir-modal" class="add-btn" onclick="mostrarModal()">+</button>
    </div>
  </nav>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2>Agregar Nueva Categoría</h2>
      <form id="form-categoria">
        <label for="nombre-categoria">Nombre:</label>
        <input type="text" id="nombre-categoria" placeholder="Ej: Oficina" required>
        
        <label for="imagen-categoria">Imagen (URL u opcional):</label>
        <input type="text" id="imagen-categoria" placeholder="Ej: https://example.com/icon.png">
        
        <div class="modal-buttons">
          <button type="submit" class="btn-primary">Agregar</button>
          <button type="button" id="btn-cerrar-modal" class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
