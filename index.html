<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Hogar PWA</title>

  <!-- Compatibilidad con iOS / Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nuestro Hogar">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">

  <link rel="manifest" href="assets/manifest.json">
  <link rel="stylesheet" href="assets/styles.css">
  <meta name="theme-color" content="#2A0C1B">
</head>
<body>

  <main>
    <section id="categorias" class="grid-container">
      <!-- Se carga automáticamente desde Firebase -->
    </section>
  </main>

  <!-- DOCK FLOTANTE INFERIOR ESTILO CÁPSULA (COMO LA REFERENCIA) -->
  <nav class="floating-dock">
    <button class="dock-item active" aria-label="Inicio">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>

    <button class="dock-item" aria-label="Categorías">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z"/></svg>
    </button>

    <!-- BOTÓN CENTRAL (+) DESTACADO -->
    <button id="btn-abrir-modal" class="dock-add-btn" aria-label="Agregar">+</button>

    <button id="btn-instalar" class="dock-item hidden" aria-label="Instalar App">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    </button>

    <button class="dock-item" aria-label="Perfil o Ajustes">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </button>
  </nav>

  <!-- Modal para agregar categoría -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2>Agregar Nueva Categoría</h2>
      <form id="form-categoria">
        <label for="nombre-categoria">Nombre:</label>
        <input type="text" id="nombre-categoria" placeholder="Ej: Oficina" required>
        
        <label for="imagen-categoria">Imagen (URL u opcional):</label>
        <input type="text" id="imagen-categoria" placeholder="Ej: https://example.com/icon.png">
        
        <div class="modal-buttons">
          <button type="submit" class="btn-primary">Agregar</button>
          <button type="button" id="btn-cerrar-modal" class="btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
