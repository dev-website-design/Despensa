<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías - Despensa</title>
  <link rel="stylesheet" href="assets/styles.css">

  <style>
    .app-container {
      max-width: 320px;
      margin: 0 auto;
      padding: 12px;
      padding-bottom: 80px;
    }
    .hero-card {
      padding: 14px !important;
      margin-bottom: 14px !important;
      border-radius: 16px !important;
    }
    .hero-title {
      font-size: 18px !important;
    }
    .hero-subtitle {
      font-size: 12px !important;
    }
    .section-header {
      margin-bottom: 10px !important;
    }
    .section-title {
      font-size: 16px !important;
    }

    .floating-dock {
      position: fixed !important;
      bottom: 20px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: calc(100% - 32px) !important;
      max-width: 320px !important;
      height: 52px !important;
      padding: 0 8px !important;
      z-index: 99;
    }

    .dock-indicator {
      position: absolute;
      top: 0;
      left: 0;
      background-color: #FFE0EB;
      border-radius: 50%;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.35s, height 0.35s, opacity 0.2s;
      pointer-events: none;
      opacity: 0;
      z-index: 1;
    }
    .dock-item, .dock-add-btn {
      position: relative;
      z-index: 2;
      transform: scale(0.88);
    }
    .dock-item.active {
      color: #2A0C1B !important;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="hero-card">
      <div class="hero-info">
        <h1 class="hero-title">Mi Despensa</h1>
        <p class="hero-subtitle" id="user-greeting">Hola...</p>
        <div class="hero-actions">
          <button class="action-btn" aria-label="Buscar">🔍</button>
          <button class="action-btn" aria-label="Ajustes">⚙️</button>
        </div>
      </div>
      <div class="hero-image-wrapper">
        <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=400&q=80" alt="Despensa" class="hero-img">
      </div>
    </div>

    <div class="section-header">
      <h2 class="section-title">Categorías</h2>
      <div class="status-dot"></div>
    </div>

    <div class="grid-container" id="contenedor-categorias">
    </div>
  </div>

  <nav class="floating-dock">
    <div id="dock-indicator" class="dock-indicator"></div>

    <a href="perfil.html" class="dock-item" aria-label="Perfil">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </a>

    <a href="categorias.html" class="dock-item active" aria-label="Categorías">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z" />
      </svg>
    </a>

    <button id="btn-open-modal" class="dock-add-btn" type="button" aria-label="Agregar">+</button>

    <button class="dock-item" aria-label="Lista">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </button>

    <a href="configuracion.html" class="dock-item" aria-label="Configuración">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
      </svg>
    </a>
  </nav>

  <div class="modal hidden" id="modal-categoria">
    <div class="modal-content">
      <h2>Nueva Categoría</h2>
      <form id="form-nueva-categoria">
        <label for="nombre-categoria">Nombre de la categoría:</label>
        <input type="text" id="nombre-categoria" placeholder="Ej: Bebidas, Frutas..." required>

        <label for="imagen-categoria">Imagen de portada:</label>
        <input type="file" id="imagen-categoria" accept="image/*">

        <div class="modal-buttons">
          <button type="button" class="btn-secondary" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn-primary">Agregar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dock = document.querySelector('.floating-dock');
      const indicator = document.getElementById('dock-indicator');
      const dockItems = document.querySelectorAll('.floating-dock .dock-item');

      function moverIndicador(elemento) {
        if (!elemento || !indicator || !dock) return;
        const dockRect = dock.getBoundingClientRect();
        const itemRect = elemento.getBoundingClientRect();

        const left = itemRect.left - dockRect.left;
        const top = itemRect.top - dockRect.top;

        indicator.style.width = `${itemRect.width}px`;
        indicator.style.height = `${itemRect.height}px`;
        indicator.style.transform = `translate(${left}px, ${top}px)`;
        indicator.style.opacity = '1';
      }

      const activeInicial = document.querySelector('.floating-dock .dock-item.active');
      if (activeInicial) {
        moverIndicador(activeInicial);
      }

      dockItems.forEach(item => {
        item.addEventListener('click', (e) => {
          const href = item.getAttribute('href');
          if (href && href !== '#') {
            e.preventDefault();
            dockItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            moverIndicador(item);
            setTimeout(() => {
              window.location.href = href;
            }, 300);
          } else {
            dockItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            moverIndicador(item);
          }
        });
      });

      window.addEventListener('resize', () => {
        const itemActivo = document.querySelector('.floating-dock .dock-item.active');
        if (itemActivo) moverIndicador(itemActivo);
      });
    });
  </script>
</body>
</html>
