<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Categorías · FINDORA</title>
  <meta name="description" content="Gestiona tus categorías de despensa en FINDORA.">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .categoria-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 16px; }
    .categoria:not(.con-imagen) .categoria-footer { text-align: center; width: 100%; }
    #form-nueva-categoria input[type="text"] { width: 100%; padding: 12px; border: 1.5px solid #e2d0d7; border-radius: 12px; font-family: var(--font-main); font-size: 1rem; background-color: #fff9fb; color: var(--black-cherry); box-sizing: border-box; margin-bottom: 12px; }
    #form-nueva-categoria input[type="file"] { width: 100%; padding: 8px 12px; background-color: #fff9fb; border: 1.5px solid #e2d0d7; border-radius: 12px; cursor: pointer; font-family: var(--font-main); box-sizing: border-box; }
    #form-nueva-categoria input[type="file"]::file-selector-button { background-color: var(--perfect-rose); color: var(--white); border: none; padding: 6px 12px; border-radius: 8px; font-family: var(--font-main); cursor: pointer; margin-right: 10px; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .modal-submit-btn { background-color: var(--perfect-rose); color: var(--white); border: none; padding: 10px 22px; border-radius: 12px; font-family: var(--font-main); font-size: 1rem; cursor: pointer; outline: none; width: 100%; }
    .user-greeting { color: var(--perfect-rose); font-size: 0.95rem; margin: 4px 0 0 0; }
    @media (max-width: 380px) { .categoria-grid { gap: 12px; } }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="hero-card">
      <div class="hero-info">
        <h1 class="hero-title">Mi Despensa</h1>
        <p class="hero-subtitle user-greeting" id="user-greeting">Hola, <span id="user-name">Cargando...</span></p>
      </div>
    </div>
    <div class="section-header">
      <h2 class="section-title">Categorías</h2>
      <span class="status-dot"></span>
    </div>
    <div class="categoria-grid" id="contenedor-categorias"></div>
  </div>

  <!-- DOCK FLOTANTE (idéntico) -->
  <div class="floating-dock" id="mainDock">
    <a href="index.html" class="dock-item" aria-label="Inicio"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></a>
    <a href="categorias.html" class="dock-item active" aria-label="Categorías"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
    <button class="dock-add-btn" aria-label="Añadir categoría" id="btn-open-modal">+</button>
    <a href="configuracion.html" class="dock-item" aria-label="Configuración"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
    <a href="perfil.html" class="dock-item" aria-label="Perfil"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
  </div>

  <!-- MODAL (usando clases globales) -->
  <div id="modal-categoria" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <h2 id="modalTitle">Nueva Categoría</h2>
      <form id="form-nueva-categoria">
        <label for="nombre-categoria">Nombre</label>
        <input type="text" id="nombre-categoria" placeholder="Ej. Frutas, Verduras..." required>
        <label for="imagen-categoria">Imagen (opcional)</label>
        <input type="file" id="imagen-categoria" accept="image/*">
        <div class="modal-buttons">
          <button type="button" class="btn-secondary" id="btn-cerrar-modal">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- app.js se encarga del renderizado y lógica de categorías -->
  <script type="module" src="app.js"></script>

  <!-- Script adicional para saludo y modal -->
  <script>
    (function() {
      function actualizarSaludo() {
        const userNameSpan = document.getElementById('user-name');
        if (!userNameSpan) return;
        let nombre = 'Invitado';
        const perfilId = localStorage.getItem('usuarioActivo');
        if (perfilId) {
          const perfilesGuardados = localStorage.getItem('perfilesPersonalizados');
          if (perfilesGuardados) {
            try { const perfiles = JSON.parse(perfilesGuardados); const encontrado = perfiles.find(p => p.id === perfilId); if (encontrado) nombre = encontrado.nombre; } catch(e) {}
          } else {
            const nombresPorId = { maria: 'María', juan: 'Juan', invitado: 'Invitado' };
            nombre = nombresPorId[perfilId] || perfilId;
          }
        } else {
          const userData = localStorage.getItem('user');
          if (userData) { try { const parsed = JSON.parse(userData); if (parsed && parsed.name) nombre = parsed.name; } catch(e) {} }
        }
        userNameSpan.textContent = nombre;
      }

      // Modal
      const modal = document.getElementById('modal-categoria');
      const openBtn = document.getElementById('btn-open-modal');
      const closeBtn = document.getElementById('btn-cerrar-modal');
      const form = document.getElementById('form-nueva-categoria');

      if (openBtn && modal) {
        openBtn.addEventListener('click', () => {
          modal.classList.remove('hidden');
          const input = document.getElementById('nombre-categoria');
          if (input) setTimeout(() => input.focus(), 100);
        });
      }
      if (closeBtn && modal) {
        closeBtn.addEventListener('click', () => { modal.classList.add('hidden'); if (form) form.reset(); });
      }
      if (modal) {
        modal.addEventListener('click', (e) => { if (e.target === modal) { modal.classList.add('hidden'); if (form) form.reset(); } });
      }
      if (form) {
        form.addEventListener('submit', (e) => { e.preventDefault(); modal.classList.add('hidden'); });
      }

      actualizarSaludo();
      window.addEventListener('storage', (e) => {
        if (e.key === 'usuarioActivo' || e.key === 'user' || e.key === 'perfilesPersonalizados') actualizarSaludo();
      });
    })();
  </script>
</body>
</html>
