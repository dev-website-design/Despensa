<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías - Despensa</title>
  <link rel="stylesheet" href="assets/styles.css">

  <style>
    /* Eliminamos el borde, sombras y contenedor de simulación móvil */
    body {
      margin: 0;
      padding: 0;
      background-color: #ffd1dc; /* Fondo rosado general */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .app-container {
      max-width: 100% !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 16px !important;
      padding-bottom: 100px !important;
      background: transparent !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      border: none !important;
      box-sizing: border-box;
    }

    /* Barra o Dock Flotante Inferior */
    .floating-dock {
      position: fixed !important;
      bottom: 20px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: calc(100% - 32px) !important;
      max-width: 400px !important;
      height: 52px !important;
      padding: 0 8px !important;
      z-index: 99;
    }

    .dock-indicator {
      position: absolute;
      top: 0;
      left: 0;
      background-color: #FFE0EB;
      border-radius: 50%;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.35s, height 0.35s, opacity 0.2s;
      pointer-events: none;
      opacity: 0;
      z-index: 1;
    }
    .dock-item, .dock-add-btn {
      position: relative;
      z-index: 2;
      transform: scale(0.88);
    }
    .dock-item.active {
      color: #2A0C1B !important;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Tarjeta Principal Superior -->
    <div class="hero-card">
      <div class="hero-info">
        <h1 class="hero-title">Mi Despensa</h1>
        <p class="hero-subtitle" id="user-greeting">Hola, MARÍA</p>
        <div class="hero-actions">
          <button class="action-btn" aria-label="Buscar">🔍</button>
          <button class="action-btn" aria-label="Ajustes">⚙️</button>
        </div>
      </div>
      <div class="hero-image-wrapper">
        <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=400&q=80" alt="Despensa" class="hero-img">
      </div>
    </div>

    <!-- Encabezado de Sección -->
    <div class="section-header">
      <h2 class="section-title">Categorías</h2>
      <div class="status-dot"></div>
    </div>

    <!-- Contenedor de Categorías / Cuadros -->
    <div class="grid-container" id="contenedor-categorias">
      <!-- Ejemplo estático de tarjetas acorde a tu diseño -->
      <div class="hero-card" style="display: flex; flex-direction: column; justify-content: space-between; min-height: 140px;">
        <p class="hero-title" style="font-size: 18px;">Te amo</p>
      </div>
      
      <div class="hero-card" style="padding: 0; overflow: hidden; position: relative;">
        <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=400&q=80" alt="Sala" style="width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0;">
        <div style="position: absolute; bottom: 10px; left: 10px; color: white; background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 8px;">
          <h3 style="margin:0; font-size: 14px;">Sala</h3>
        </div>
      </div>

      <div class="hero-card" style="padding: 0; overflow: hidden; position: relative;">
        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=400&q=80" alt="Perrito" style="width: 100%; height: 100%; object-fit: cover;">
      </div>

      <div class="hero-card" style="display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
        <p class="hero-title" style="font-size: 16px;">Tengo hambre ❤️ 👉</p>
      </div>

      <div class="hero-card" style="display: flex; flex-direction: column; justify-content: space-between; min-height: 140px;">
        <p class="hero-title" style="font-size: 18px;">Cocina</p>
      </div>
    </div>
  </div>

  <!-- Dock Flotante Inferior -->
  <nav class="floating-dock">
    <div id="dock-indicator" class="dock-indicator"></div>

    <a href="perfil.html" class="dock-item" aria-label="Perfil">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </a>

    <a href="categorias.html" class="dock-item active" aria-label="Categorías">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z" />
      </svg>
    </a>

    <button id="btn-open-modal" class="dock-add-btn" type="button" aria-label="Agregar">+</button>

    <button class="dock-item" aria-label="Lista">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </button>

    <a href="configuracion.html" class="dock-item" aria-label="Configuración">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
      </svg>
    </a>
  </nav>

  <script type="module" src="app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dock = document.querySelector('.floating-dock');
      const indicator = document.getElementById('dock-indicator');
      const dockItems = document.querySelectorAll('.floating-dock .dock-item');

      function moverIndicador(elemento) {
        if (!elemento || !indicator || !dock) return;
        const dockRect = dock.getBoundingClientRect();
        const itemRect = elemento.getBoundingClientRect();

        const left = itemRect.left - dockRect.left;
        const top = itemRect.top - dockRect.top;

        indicator.style.width = `${itemRect.width}px`;
        indicator.style.height = `${itemRect.height}px`;
        indicator.style.transform = `translate(${left}px, ${top}px)`;
        indicator.style.opacity = '1';
      }

      const activeInicial = document.querySelector('.floating-dock .dock-item.active');
      if (activeInicial) {
        moverIndicador(activeInicial);
      }

      dockItems.forEach(item => {
        item.addEventListener('click', (e) => {
          const href = item.getAttribute('href');
          if (href && href !== '#') {
            e.preventDefault();
            dockItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            moverIndicador(item);
            setTimeout(() => {
              window.location.href = href;
            }, 300);
          } else {
            dockItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            moverIndicador(item);
          }
        });
      });

      window.addEventListener('resize', () => {
        const itemActivo = document.querySelector('.floating-dock .dock-item.active');
        if (itemActivo) moverIndicador(itemActivo);
      });
    });
  </script>
</body>
</html>
