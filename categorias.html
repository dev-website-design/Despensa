<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Hogar</title>

  <!-- Compatibilidad iOS / Apple -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hogar">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">

  <link rel="manifest" href="assets/manifest.json">
  <link rel="stylesheet" href="assets/styles.css">
  <meta name="theme-color" content="#FFE0EB">
</head>
<body>

  <main class="app-container">
    
    <!-- TARJETA DESTACADA SUPERIOR (HERO) -->
    <section class="hero-card">
      <div class="hero-info">
        <h1 class="hero-title">Nuestro Hogar</h1>
        <p class="hero-subtitle">Una Familia Feliz</p>
        
        <div class="hero-actions">
          <button class="action-btn" aria-label="Inicio">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
            </svg>
          </button>
          <button class="action-btn" aria-label="Favorito">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="hero-image-wrapper">
        <img src="https://images.unsplash.com/photo-1614594975525-e45190c55d0b?w=600&auto=format&fit=crop&q=80" alt="Planta Principal" class="hero-img">
      </div>
    </section>

    <!-- TÍTULO DE SECCIÓN -->
    <div class="section-header">
      <h2 class="section-title">Mis Categorías</h2>
      <span class="status-dot"></span>
    </div>

    <!-- GRILLA EN 2 COLUMNAS (FIREBASE) -->
    <section id="categorias" class="grid-container">
      <!-- Carga dinámica desde Firestore -->
    </section>

  </main>

  <!-- DOCK FLOTANTE INFERIOR -->
  <nav class="floating-dock">
    <!-- Indicador deslizante suave -->
    <div id="dock-indicator" class="dock-indicator"></div>

    <button class="dock-item active" aria-label="Inicio">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </button>

    <button class="dock-item" aria-label="Categorías">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z" />
      </svg>
    </button>

    <!-- BOTÓN CENTRAL (+) -->
    <button id="btn-abrir-modal" class="dock-add-btn" aria-label="Agregar">+</button>

    <button class="dock-item" aria-label="Lista">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </button>

    <button class="dock-item" aria-label="Ajustes">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
      </svg>
    </button>
  </nav>

  <!-- MODAL PARA AGREGAR CATEGORÍA -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2>Nueva Categoría</h2>
      <form id="form-categoria">
        <label for="nombre-categoria">Nombre:</label>
        <input type="text" id="nombre-categoria" placeholder="Ej: Monstera" required>
        
        <label for="imagen-categoria">URL de Imagen (Opcional):</label>
        <input type="text" id="imagen-categoria" placeholder="Ej: https://.../foto.jpg">
        
        <div class="modal-buttons">
          <button type="submit" class="btn-primary">Guardar</button>
          <button type="button" id="btn-cerrar-modal" class="btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
