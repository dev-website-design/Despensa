<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías - Despensa</title>
  <link rel="stylesheet" href="assets/styles.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffd1dc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .app-container {
      max-width: 100% !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 16px !important;
      padding-bottom: 100px !important;
      background: transparent !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      border: none !important;
      box-sizing: border-box;
    }

    /* Estilos para las tarjetas dinámicas que genera tu app.js */
    .categoria {
      background: #ffffff;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(42, 12, 27, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 140px;
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      transition: transform 0.2s;
    }

    .categoria:active {
      transform: scale(0.96);
    }

    .categoria.con-imagen {
      padding: 0;
    }

    .categoria:not(.con-imagen) .categoria-footer {
      font-size: 18px;
      font-weight: bold;
      color: #2A0C1B;
      text-align: center;
    }

    .categoria.con-imagen .categoria-footer {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
    }

    /* Barra o Dock Flotante Inferior */
    .floating-dock {
      position: fixed !important;
      bottom: 20px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: calc(100% - 32px) !important;
      max-width: 400px !important;
      height: 52px !important;
      padding: 0 8px !important;
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .dock-indicator {
      position: absolute;
      top: 0;
      left: 0;
      background-color: #FFE0EB;
      border-radius: 50%;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.35s, height 0.35s, opacity 0.2s;
      pointer-events: none;
      opacity: 0;
      z-index: 1;
    }

    .dock-item {
      position: relative;
      z-index: 2;
      transform: scale(0.88);
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .dock-item.active {
      color: #2A0C1B !important;
      transform: scale(0.98);
    }

    /* 🔴 AQUÍ ESTÁ LA CORRECCIÓN DEL BOTÓN + 🔴 */
    .dock-add-btn {
      position: relative;
      z-index: 2;
      width: 48px !important;
      height: 48px !important;
      min-width: 48px !important; /* Bloquea el ancho */
      min-height: 48px !important; /* Bloquea el alto */
      flex-shrink: 0 !important; /* Impide que la barra lo aplaste */
      background-color: #d63384 !important;
      color: white !important;
      border-radius: 50% !important; /* Lo hace completamente redondo */
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 32px !important;
      border: none !important;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(214, 51, 132, 0.4) !important;
      padding: 0 !important;
      margin: 0 !important;
      line-height: 0 !important; /* Centra el "+" a la perfección */
    }

    /* Diseño del Modal Pop-up */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(42, 12, 27, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .hidden {
      display: none !important;
      opacity: 0;
    }

    .modal-content {
      background: #ffffff;
      width: 85%;
      max-width: 340px;
      border-radius: 32px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(42, 12, 27, 0.15);
      animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-sizing: border-box;
    }

    @keyframes modalIn {
      from { transform: translateY(20px) scale(0.95); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      color: #2A0C1B;
    }

    .modal-close-btn {
      background: #fff0f3;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2A0C1B;
      font-weight: bold;
      transition: background 0.2s;
    }

    .modal-body input {
      width: 100%;
      padding: 14px 16px;
      background: #faf7f8;
      border: 1px solid #f0e1e6;
      border-radius: 16px;
      font-size: 14px;
      margin-bottom: 14px;
      box-sizing: border-box;
      outline: none;
      color: #2A0C1B;
      font-family: inherit;
    }

    .modal-body input[type="file"] {
      padding: 10px;
      background: #ffffff;
    }

    .modal-submit-btn {
      width: 100%;
      background: #2A0C1B;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 24px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(42, 12, 27, 0.2);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Tarjeta Principal Superior -->
    <div class="hero-card" style="background: white; border-radius: 24px; padding: 20px; margin-bottom: 20px;">
      <div class="hero-info">
        <h1 class="hero-title" style="margin:0; font-size: 24px;">Mi Despensa</h1>
        <p class="hero-subtitle" id="user-greeting" style="color: gray; margin-top: 5px;">Hola, Cargando...</p>
      </div>
    </div>

    <!-- Encabezado de Sección -->
    <div class="section-header" style="margin-bottom: 15px;">
      <h2 class="section-title" style="margin:0;">Categorías</h2>
    </div>

    <!-- Contenedor de Categorías -->
    <div class="grid-container" id="contenedor-categorias" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
      <!-- Se llena automáticamente con app.js -->
    </div>
  </div>

  <!-- Modal Pop-up -->
  <div id="modal-categoria" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Nueva Categoría</h3>
        <button id="btn-cerrar-modal" class="modal-close-btn" type="button">✕</button>
      </div>
      <div class="modal-body">
        <form id="form-nueva-categoria">
          <input type="text" id="nombre-categoria" placeholder="Nombre de la categoría..." required>
          <label style="font-size: 12px; color: gray; margin-bottom: 4px; display: block;">Imagen (Opcional):</label>
          <input type="file" id="imagen-categoria" accept="image/*">
          <button type="submit" class="modal-submit-btn" style="margin-top: 10px;">Guardar Categoría</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Dock Flotante Inferior -->
  <nav class="floating-dock">
    <div id="dock-indicator" class="dock-indicator"></div>

    <a href="perfil.html" class="dock-item" aria-label="Perfil">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </a>

    <a href="categorias.html" class="dock-item active" aria-label="Categorías">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5H5v6zm6-6v6h5V5h-5z" />
      </svg>
    </a>

    <!-- Botón + Corregido y más limpio -->
    <button id="btn-open-modal" class="dock-add-btn" type="button" aria-label="Agregar">
      +
    </button>

    <button class="dock-item" aria-label="Lista" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </button>

    <a href="configuracion.html" class="dock-item" aria-label="Configuración">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
      </svg>
    </a>
  </nav>

  <script type="module" src="app.js"></script>

  <!-- Animación estética de la barra inferior -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dock = document.querySelector('.floating-dock');
      const indicator = document.getElementById('dock-indicator');
      const dockItems = document.querySelectorAll('.floating-dock .dock-item');

      function moverIndicador(elemento) {
        if (!elemento || !indicator || !dock) return;
        const dockRect = dock.getBoundingClientRect();
        const itemRect = elemento.getBoundingClientRect();

        const left = itemRect.left - dockRect.left;
        const top = itemRect.top - dockRect.top;

        indicator.style.width = `${itemRect.width}px`;
        indicator.style.height = `${itemRect.height}px`;
        indicator.style.transform = `translate(${left}px, ${top}px)`;
        indicator.style.opacity = '1';
      }

      const activeInicial = document.querySelector('.floating-dock .dock-item.active');
      if (activeInicial) {
        setTimeout(() => moverIndicador(activeInicial), 100);
      }

      dockItems.forEach(item => {
        item.addEventListener('click', (e) => {
          const href = item.getAttribute('href');
          if (href && href !== '#') {
            e.preventDefault();
            dockItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            moverIndicador(item);
            setTimeout(() => {
              window.location.href = href;
            }, 250);
          }
        });
      });

      window.addEventListener('resize', () => {
        const itemActivo = document.querySelector('.floating-dock .dock-item.active');
        if (itemActivo) moverIndicador(itemActivo);
      });
    });
  </script>
</body>
</html>
