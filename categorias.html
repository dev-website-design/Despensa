<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías - Despensa</title>
  <link rel="stylesheet" href="assets/styles.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffd1dc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .app-container {
      max-width: 100% !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 16px !important;
      padding-bottom: 100px !important;
      background: transparent !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      border: none !important;
      box-sizing: border-box;
    }

    /* Barra o Dock Flotante Inferior */
    .floating-dock {
      position: fixed !important;
      bottom: 20px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: calc(100% - 32px) !important;
      max-width: 400px !important;
      height: 52px !important;
      padding: 0 8px !important;
      z-index: 99;
    }

    .dock-indicator {
      position: absolute;
      top: 0;
      left: 0;
      background-color: #FFE0EB;
      border-radius: 50%;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.35s, height 0.35s, opacity 0.2s;
      pointer-events: none;
      opacity: 0;
      z-index: 1;
    }

    .dock-item, .dock-add-btn {
      position: relative;
      z-index: 2;
      transform: scale(0.88);
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .dock-item.active {
      color: #2A0C1B !important;
      transform: scale(0.98);
    }

    /* Nuevo Diseño del Modal Pop-up (Armónico con la App) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(42, 12, 27, 0.4); /* Fondo oscuro semitransparente elegante */
      backdrop-filter: blur(4px); /* Efecto difuminado moderno */
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: #ffffff;
      width: 85%;
      max-width: 340px;
      border-radius: 32px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(42, 12, 27, 0.15);
      transform: translateY(20px) scale(0.95);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-sizing: border-box;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      color: #2A0C1B;
      letter-spacing: 0.5px;
    }

    .modal-close-btn {
      background: #fff0f3;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2A0C1B;
      font-weight: bold;
      transition: background 0.2s;
    }

    .modal-close-btn:hover {
      background: #ffe0eb;
    }

    .modal-body input, 
    .modal-body textarea {
      width: 100%;
      padding: 14px 16px;
      background: #faf7f8;
      border: 1px solid #f0e1e6;
      border-radius: 16px;
      font-size: 14px;
      margin-bottom: 14px;
      box-sizing: border-box;
      outline: none;
      color: #2A0C1B;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }

    .modal-body input:focus, 
    .modal-body textarea:focus {
      border-color: #2A0C1B;
      background: #ffffff;
    }

    .modal-submit-btn {
      width: 100%;
      background: #2A0C1B; /* Color acorde al estilo oscuro/elegante de los botones principales */
      color: white;
      border: none;
      padding: 15px;
      border-radius: 24px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(42, 12, 27, 0.2);
    }

    .modal-submit-btn:hover {
      background: #401328;
    }

    .modal-submit-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Tarjeta Principal Superior -->
    <div class="hero-card">
      <div class="hero-info">
        <h1 class="hero-title">Mi Despensa</h1>
        <p class="hero-subtitle" id="user-greeting">Hola, MARÍA</p>
        <div class="hero-actions">
          <button class="action-btn" aria-label="Buscar">🔍</button>
          <button class="action-btn" aria-label="Ajustes">⚙️</button>
        </div>
      </div>
      <div class="hero-image-wrapper">
        <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=400&q=80" alt="Despensa" class="hero-img">
      </div>
    </div>

    <!-- Encabezado de Sección -->
    <div class="section-header">
      <h2 class="section-title">Categorías</h2>
      <div class="status-dot"></div>
    </div>

    <!-- Contenedor de Categorías / Cuadros -->
    

  <!-- Modal Pop-up Rediseñado -->
  <div id="add-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Nueva Categoría</h3>
        <button id="modal-close-btn" class="modal-close-btn" type="button">✕</button>
      </div>
      <div class="modal-body">
        <form id="add-form" onsubmit="event.preventDefault(); alert('Categoría agregada con éxito'); document.getElementById('add-modal').classList.remove('active');">
          <input type="text" placeholder="Nombre de la categoría..." required>
          <textarea placeholder="Descripción o detalles..." rows="3" style="resize: none;"></textarea>
          <button type="submit" class="modal-submit-btn">Añadir Categoría</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Dock Flotante Inferior -->
  <nav class="floating-dock">
    <div id="dock-indicator" class="dock-indicator"></div>

    <a href="perfil.html" class="dock-item" aria-label="Perfil">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </a>

    <a href="categorias.html" class="dock-item active" aria-label="Categorías">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z" />
      </svg>
    </a>

    <button id="btn-open-modal" class="dock-add-btn" type="button" aria-label="Agregar">+</button>

    <button class="dock-item" aria-label="Lista" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </button>

    <a href="configuracion.html" class="dock-item" aria-label="Configuración">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
      </svg>
    </a>
  </nav>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dock = document.querySelector('.floating-dock');
      const indicator = document.getElementById('dock-indicator');
      const dockItems = document.querySelectorAll('.floating-dock .dock-item');
      
      const btnOpenModal = document.getElementById('btn-open-modal');
      const modal = document.getElementById('add-modal');
      const modalCloseBtn = document.getElementById('modal-close-btn');

      if (btnOpenModal && modal) {
        btnOpenModal.addEventListener('click', (e) => {
          e.stopPropagation();
          modal.classList.add('active');
        });
      }

      if (modalCloseBtn && modal) {
        modalCloseBtn.addEventListener('click', () => {
          modal.classList.remove('active');
        });
      }

      if (modal) {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) {
            modal.classList.remove('active');
          }
        });
      }

      function moverIndicador(elemento) {
        if (!elemento || !indicator || !dock) return;
        const dockRect = dock.getBoundingClientRect();
        const itemRect = elemento.getBoundingClientRect();

        const left = itemRect.left - dockRect.left;
        const top = itemRect.top - dockRect.top;

        indicator.style.width = `${itemRect.width}px`;
        indicator.style.height = `${itemRect.height}px`;
        indicator.style.transform = `translate(${left}px, ${top}px)`;
        indicator.style.opacity = '1';
      }

      const activeInicial = document.querySelector('.floating-dock .dock-item.active');
      if (activeInicial) {
        moverIndicador(activeInicial);
      }

      dockItems.forEach(item => {
        item.addEventListener('click', (e) => {
          const href = item.getAttribute('href');
          if (href && href !== '#') {
            e.preventDefault();
            dockItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            moverIndicador(item);
            setTimeout(() => {
              window.location.href = href;
            }, 300);
          } else {
            dockItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            moverIndicador(item);
          }
        });
      });

      window.addEventListener('resize', () => {
        const itemActivo = document.querySelector('.floating-dock .dock-item.active');
        if (itemActivo) moverIndicador(itemActivo);
      });
    });
  </script>
</body>
</html>
