<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías - Despensa</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <div class="app-container">
    <!-- Hero Card -->
    <div class="hero-card">
      <div class="hero-info">
        <h1 class="hero-title">Mi Despensa</h1>
        <p class="hero-subtitle" id="user-greeting">Hola...</p>
        <div class="hero-actions">
          <button class="action-btn">🔍</button>
          <button class="action-btn">⚙️</button>
        </div>
      </div>
      <div class="hero-image-wrapper">
        <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=400&q=80" alt="Despensa" class="hero-img">
      </div>
    </div>

    <!-- Encabezado de Sección -->
    <div class="section-header">
      <h2 class="section-title">Categorías</h2>
      <div class="status-dot"></div>
    </div>

    <!-- Grilla de Categorías Sincronizada -->
    <div class="grid-container" id="contenedor-categorias">
      <!-- Se genera dinámicamente desde Firebase -->
    </div>
  </div>

  <!-- Dock Flotante -->
  <nav class="floating-dock">
    <a href="perfil.html" class="dock-item">👤</a>
    <a href="categorias.html" class="dock-item active">🏠</a>
    <button class="dock-add-btn" id="btn-open-modal">+</button>
    <a href="#" class="dock-item">📋</a>
    <a href="#" class="dock-item">❤️</a>
  </nav>

  <!-- Modal para Agregar Categoría -->
  <div class="modal hidden" id="modal-categoria">
    <div class="modal-content">
      <h2>Nueva Categoría</h2>
      <form id="form-nueva-categoria">
        <label for="nombre-categoria">Nombre de la categoría:</label>
        <input type="text" id="nombre-categoria" placeholder="Ej: Bebidas, Frutas..." required>

        <label for="imagen-categoria">Imagen de portada:</label>
        <input type="file" id="imagen-categoria" accept="image/*">

        <div class="modal-buttons">
          <button type="button" class="btn-secondary" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn-primary">Agregar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Lógica modular con Firebase -->
  <script type="module" src="app.js"></script>
</body>
</html>
