<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Despensa / Envíos</title>
  <link rel="stylesheet" href="assets/styles.css">

  <style>
    /* Eliminamos el contenedor de simulación móvil para pantalla completa */
    .app-container {
      max-width: 100% !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 16px !important;
      padding-bottom: 90px !important;
      background: transparent !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      border: none !important;
    }

    /* Estilos específicos basados en la imagen de referencia */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .user-profile-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #dce6e0;
    }

    .user-greeting-text span {
      font-size: 12px;
      color: #718096;
      display: block;
    }

    .user-greeting-text h2 {
      font-size: 16px;
      font-weight: 700;
      color: #1a202c;
      margin: 0;
    }

    .notification-bell-btn {
      background: #ffffff;
      border: 1px solid #edf2f7;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    /* Tarjeta verde principal */
    .main-tracking-card {
      background-color: #2e634d;
      color: #ffffff;
      border-radius: 20px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      box-shadow: 0 6px 16px rgba(46, 99, 77, 0.2);
    }

    .tracking-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .tracking-icon-box {
      background: rgba(255, 255, 255, 0.2);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .tracking-info h4 {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 2px 0;
    }

    .tracking-info p {
      font-size: 11px;
      opacity: 0.85;
      margin: 0;
    }

    .tracking-arrow {
      font-size: 18px;
      background: rgba(255, 255, 255, 0.2);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Secciones */
    .section-title-custom {
      font-size: 16px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 12px;
    }

    /* Grilla de Servicios (3 columnas) */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .service-card {
      background: #ffffff;
      border: 1px solid #edf2f7;
      border-radius: 16px;
      padding: 14px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      text-decoration: none;
      color: #2d3748;
      transition: transform 0.2s;
    }

    .service-card:hover {
      transform: translateY(-2px);
    }

    .service-icon-wrap {
      width: 38px;
      height: 38px;
      background: #f7fafc;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .service-card span {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
    }

    /* Tarjeta de Envoi récent */
    .recent-shipment-card {
      background: #ffffff;
      border: 1px solid #edf2f7;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .recent-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .recent-img-box {
      width: 40px;
      height: 40px;
      background: #f7fafc;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .recent-details h5 {
      font-size: 13px;
      font-weight: 700;
      color: #2d3748;
      margin: 0 0 2px 0;
    }

    .recent-details p {
      font-size: 11px;
      color: #718096;
      margin: 0;
    }

    .recent-details span {
      font-size: 10px;
      color: #48bb78;
      font-weight: 600;
    }

    .recent-arrow {
      color: #a0aec0;
      font-size: 16px;
    }

    /* Dock Flotante Inferior */
    .floating-dock {
      position: fixed !important;
      bottom: 20px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: calc(100% - 32px) !important;
      max-width: 400px !important;
      height: 52px !important;
      padding: 0 8px !important;
      z-index: 99;
    }

    .dock-indicator {
      position: absolute;
      top: 0;
      left: 0;
      background-color: #FFE0EB;
      border-radius: 50%;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.35s, height 0.35s, opacity 0.2s;
      pointer-events: none;
      opacity: 0;
      z-index: 1;
    }
    .dock-item, .dock-add-btn {
      position: relative;
      z-index: 2;
      transform: scale(0.88);
    }
    .dock-item.active {
      color: #2A0C1B !important;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Cabecera Superior con Perfil y Notificaciones -->
    <div class="top-header">
      <div class="user-profile-header">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Sophie" class="user-avatar-img">
        <div class="user-greeting-text">
          <span>Bonjour,</span>
          <h2>Sophie</h2>
        </div>
      </div>
      <button class="notification-bell-btn" aria-label="Notificaciones">
        🔔
      </button>
    </div>

    <!-- Tarjeta Principal de Seguimiento (Verde) -->
    <div class="main-tracking-card">
      <div class="tracking-content">
        <div class="tracking-icon-box">📦</div>
        <div class="tracking-info">
          <h4>Vérifier l'envoi</h4>
          <p>Entrez votre numéro de suivi</p>
        </div>
      </div>
      <div class="tracking-arrow">→</div>
    </div>

    <!-- Sección de Servicios -->
    <h3 class="section-title-custom">Services</h3>
    <div class="services-grid">
      <a href="#" class="service-card">
        <div class="service-icon-wrap">📦</div>
        <span>Envoyer un colis</span>
      </a>
      <a href="#" class="service-card">
        <div class="service-icon-wrap">🔍</div>
        <span>Suivre un colis</span>
      </a>
      <a href="#" class="service-card">
        <div class="service-icon-wrap">📍</div>
        <span>Points de dépôt</span>
      </a>
      <a href="#" class="service-card">
        <div class="service-icon-wrap">📄</div>
        <span>Estimer le tarif</span>
      </a>
      <a href="#" class="service-card">
        <div class="service-icon-wrap">💳</div>
        <span>Programme de fidélité</span>
      </a>
      <a href="#" class="service-card">
        <div class="service-icon-wrap">⏰</div>
        <span>Aide et support</span>
      </a>
    </div>

    <!-- Sección de Envoi Récent -->
    <h3 class="section-title-custom">Envoi récent</h3>
    <div class="recent-shipment-card">
      <div class="recent-left">
        <div class="recent-img-box">📦</div>
        <div class="recent-details">
          <h5>Colis #4587</h5>
          <p>En cours de livraison</p>
          <span>Arrivée aujourd'hui</span>
        </div>
      </div>
      <div class="recent-arrow">›</div>
    </div>
  </div>

  <!-- DOCK FLOTANTE INFERIOR -->
  <nav class="floating-dock">
    <div id="dock-indicator" class="dock-indicator"></div>

    <!-- 1. Perfil / Inicio (ACTIVO AQUÍ) -->
    <a href="perfil.html" class="dock-item active" aria-label="Perfil">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </a>

    <!-- 2. Categorías -->
    <a href="categorias.html" class="dock-item" aria-label="Categorías">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z" />
      </svg>
    </a>

    <!-- 3. BOTÓN CENTRAL (+) -->
    <button id="btn-open-modal" class="dock-add-btn" type="button" aria-label="Agregar">+</button>

    <!-- 4. Lista -->
    <button class="dock-item" aria-label="Lista">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </button>

    <!-- 5. CONFIGURACIÓN -->
    <a href="configuracion.html" class="dock-item" aria-label="Configuración">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
      </svg>
    </a>
  </nav>

  <!-- Script para la animación y posicionamiento del indicador -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dock = document.querySelector('.floating-dock');
      const indicator = document.getElementById('dock-indicator');
      const dockItems = document.querySelectorAll('.floating-dock .dock-item');

      function moverIndicador(elemento) {
        if (!elemento || !indicator || !dock) return;
        const dockRect = dock.getBoundingClientRect();
        const itemRect = elemento.getBoundingClientRect();

        const left = itemRect.left - dockRect.left;
        const top = itemRect.top - dockRect.top;

        indicator.style.width = `${itemRect.width}px`;
        indicator.style.height = `${itemRect.height}px`;
        indicator.style.transform = `translate(${left}px, ${top}px)`;
        indicator.style.opacity = '1';
      }

      const activeInicial = document.querySelector('.floating-dock .dock-item.active');
      if (activeInicial) {
        moverIndicador(activeInicial);
      }

      dockItems.forEach(item => {
        item.addEventListener('click', (e) => {
          const href = item.getAttribute('href');
          if (href && href !== '#') {
            e.preventDefault();
            dockItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            moverIndicador(item);
            setTimeout(() => {
              window.location.href = href;
            }, 300);
          } else {
            dockItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            moverIndicador(item);
          }
        });
      });

      window.addEventListener('resize', () => {
        const itemActivo = document.querySelector('.floating-dock .dock-item.active');
        if (itemActivo) moverIndicador(itemActivo);
      });
    });
  </script>
</body>
</html>
