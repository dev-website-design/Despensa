<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración - Despensa</title>
  <link rel="stylesheet" href="assets/styles.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffd1dc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .app-container {
      max-width: 100% !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 16px !important;
      padding-bottom: 100px !important;
      background: transparent !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      border: none !important;
      box-sizing: border-box;
    }

    /* Estilos de la sección de configuración */
    .config-section {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(42, 12, 27, 0.05);
      margin-bottom: 16px;
    }

    .config-title {
      font-size: 18px;
      font-weight: 800;
      color: #2A0C1B;
      margin-top: 0;
      margin-bottom: 12px;
    }

    .config-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f0e1e6;
      color: #2A0C1B;
      font-size: 15px;
    }

    .config-item:last-child {
      border-bottom: none;
    }

    /* Barra o Dock Flotante Inferior */
    .floating-dock {
      position: fixed !important;
      bottom: 20px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: calc(100% - 32px) !important;
      max-width: 400px !important;
      height: 52px !important;
      padding: 0 8px !important;
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: space-around;
      background-color: #2A0C1B !important;
      border-radius: 26px !important;
      box-shadow: 0 10px 25px rgba(42, 12, 27, 0.2) !important;
    }

    .dock-indicator {
      position: absolute;
      top: 4px;
      left: 0;
      background-color: #FFE0EB;
      border-radius: 50%;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.35s, height 0.35s, opacity 0.2s;
      pointer-events: none;
      opacity: 0;
      z-index: 1;
    }

    .dock-item {
      position: relative;
      z-index: 2;
      transform: scale(0.88);
      background: transparent;
      border: none;
      cursor: pointer;
      color: #bfa5b3 !important; /* Color grisáceo/rosado para iconos inactivos */
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .dock-item.active {
      color: #2A0C1B !important;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Tarjeta Principal Superior -->
    <div class="hero-card" style="background: white; border-radius: 24px; padding: 20px; margin-bottom: 20px;">
      <div class="hero-info">
        <h1 class="hero-title" style="margin:0; font-size: 24px; color: #2A0C1B;">Configuración</h1>
        <p class="hero-subtitle" id="user-greeting" style="color: gray; margin-top: 5px;">Preferencias de la cuenta</p>
      </div>
    </div>

    <!-- Sección de Opciones -->
    <div class="config-section">
      <h2 class="config-title">General</h2>
      <div class="config-item">
        <span>Modo Oscuro</span>
        <input type="checkbox" style="cursor: pointer;">
      </div>
      <div class="config-item">
        <span>Notificaciones</span>
        <input type="checkbox" checked style="cursor: pointer;">
      </div>
    </div>
  </div>

  <!-- Dock Flotante Inferior (Sin el botón +) -->
  <nav class="floating-dock">
    <div id="dock-indicator" class="dock-indicator"></div>

    <a href="perfil.html" class="dock-item" aria-label="Perfil">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
      </svg>
    </a>

    <a href="categorias.html" class="dock-item" aria-label="Categorías">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5H5v6zm6-6v6h5V5h-5z" />
      </svg>
    </a>

    <button class="dock-item" aria-label="Lista" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </button>

    <!-- Configuración activa -->
    <a href="configuracion.html" class="dock-item active" aria-label="Configuración">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
      </svg>
    </a>
  </nav>

  <script type="module" src="app.js"></script>

  <!-- Script para la animación de la barra inferior -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dock = document.querySelector('.floating-dock');
      const indicator = document.getElementById('dock-indicator');
      const dockItems = document.querySelectorAll('.floating-dock .dock-item');

      function moverIndicador(elemento) {
        if (!elemento || !indicator || !dock) return;
        const dockRect = dock.getBoundingClientRect();
        const itemRect = elemento.getBoundingClientRect();

        const left = itemRect.left - dockRect.left;
        const top = itemRect.top - dockRect.top;

        indicator.style.width = `${itemRect.width}px`;
        indicator.style.height = `${itemRect.height}px`;
        indicator.style.transform = `translate(${left}px, ${top}px)`;
        indicator.style.opacity = '1';
      }

      const activeInicial = document.querySelector('.floating-dock .dock-item.active');
      if (activeInicial) {
        setTimeout(() => moverIndicador(activeInicial), 100);
      }

      dockItems.forEach(item => {
        item.addEventListener('click', (e) => {
          const href = item.getAttribute('href');
          if (href && href !== '#') {
            e.preventDefault();
            dockItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            moverIndicador(item);
            setTimeout(() => {
              window.location.href = href;
            }, 250);
          }
        });
      });

      window.addEventListener('resize', () => {
        const itemActivo = document.querySelector('.floating-dock .dock-item.active');
        if (itemActivo) moverIndicador(itemActivo);
      });
    });
  </script>
</body>
</html>
