<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Configuración · FINDORA</title>
  <meta name="description" content="Preferencias y ajustes de tu cuenta en FINDORA.">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .config-section { background: var(--white); border-radius: 28px; padding: 20px; box-shadow: 0 10px 25px rgba(42, 12, 27, 0.05); margin-bottom: 16px; }
    .config-title { font-size: 1.2rem; font-weight: 600; color: var(--black-cherry); margin-top: 0; margin-bottom: 12px; }
    .config-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0e1e6; color: var(--black-cherry); font-size: 1rem; }
    .config-item:last-child { border-bottom: none; }
    .config-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--perfect-rose); cursor: pointer; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="hero-card">
      <div class="hero-info">
        <h1 class="hero-title">⚙️ Configuración</h1>
        <p class="hero-subtitle" id="user-greeting" style="color: var(--perfect-rose); margin-top: 5px;">Preferencias de la cuenta</p>
      </div>
    </div>
    <div class="config-section">
      <h2 class="config-title">General</h2>
      <div class="config-item">
        <span>🌙 Modo Oscuro</span>
        <input type="checkbox" id="darkModeToggle">
      </div>
      <div class="config-item">
        <span>🔔 Notificaciones</span>
        <input type="checkbox" id="notificationsToggle" checked>
      </div>
    </div>
    <div class="config-section">
      <h2 class="config-title">Acerca de</h2>
      <div class="config-item" style="border-bottom: none; justify-content: center; font-size: 0.9rem; color: #8e8e93;">
        <span>FINDORA v1.0 · Despensa inteligente</span>
      </div>
    </div>
  </div>

  <!-- DOCK FLOTANTE -->
  <div class="floating-dock" id="mainDock">
    <a href="index.html" class="dock-item" aria-label="Inicio"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></a>
    <a href="categorias.html" class="dock-item" aria-label="Categorías"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
    <button class="dock-add-btn" aria-label="Añadir categoría" id="addCategoryBtn">+</button>
    <a href="configuracion.html" class="dock-item active" aria-label="Configuración"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
    <a href="perfil.html" class="dock-item" aria-label="Perfil"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
  </div>

  <script>
    // Persistencia de opciones
    const darkToggle = document.getElementById('darkModeToggle');
    const notifToggle = document.getElementById('notificationsToggle');

    // Cargar estado guardado
    const savedDark = localStorage.getItem('darkMode');
    const savedNotif = localStorage.getItem('notifications');
    if (savedDark === 'true') { darkToggle.checked = true; document.body.classList.add('dark-mode'); }
    if (savedNotif === 'false') notifToggle.checked = false;

    darkToggle.addEventListener('change', () => {
      localStorage.setItem('darkMode', darkToggle.checked);
      document.body.classList.toggle('dark-mode', darkToggle.checked);
    });
    notifToggle.addEventListener('change', () => {
      localStorage.setItem('notifications', notifToggle.checked);
    });

    // El dock add button redirige a categorías con modal abierto (opcional)
    document.getElementById('addCategoryBtn').addEventListener('click', () => {
      window.location.href = 'categorias.html';
    });
  </script>
</body>
</html>
