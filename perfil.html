<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Despensa</title>
  <link rel="stylesheet" href="assets/styles.css">

  <style>
    body, html {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      height: 100%;
      background-color: #1a1a1c;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .app-container {
      width: 100% !important;
      max-width: 100% !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 24px !important;
      background-color: #1a1a1c !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Botón de cerrar o volver (arriba a la izquierda) */
    .close-btn {
      position: absolute;
      top: 24px;
      left: 24px;
      background: #2c2c2e;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: #3a3a3c;
    }

    /* Contenido de selección de perfiles */
    .profile-selection-wrapper {
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .profile-title {
      color: #ffffff;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .profile-subtitle {
      color: #8e8e93;
      font-size: 14px;
      margin-bottom: 40px;
    }

    .profiles-grid {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .profile-card {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s;
    }

    .profile-card:hover {
      transform: scale(1.05);
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      position: relative;
    }

    .profile-avatar.maria {
      border: 3px solid #e91e63;
      background: #2c2c2e;
    }

    .profile-avatar.juan {
      border: 3px solid #00bcd4;
      background: #2c2c2e;
    }

    .profile-name {
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Botón para regresar a categorías -->
    <button class="close-btn" onclick="window.location.href='categorias.html'" aria-label="Cerrar">✕</button>

    <div class="profile-selection-wrapper">
      <h1 class="profile-title">Selecciona tu perfil</h1>
      <p class="profile-subtitle">Que tengas un bonito día..</p>

      <div class="profiles-grid">
        <!-- Perfil María -->
        <button class="profile-card" onclick="cambiarUsuario('MARÍA')">
          <div class="profile-avatar maria">
            <svg width="45" height="45" viewBox="0 0 24 24" fill="#e91e63">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
          </div>
          <span class="profile-name">MARÍA</span>
        </button>

        <!-- Perfil Juan -->
        <button class="profile-card" onclick="cambiarUsuario('JUAN')">
          <div class="profile-avatar juan">
            <svg width="45" height="45" viewBox="0 0 24 24" fill="#00bcd4">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
          </div>
          <span class="profile-name">JUAN</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    function cambiarUsuario(nombre) {
      localStorage.setItem('usuarioActivo', nombre);
      window.location.href = 'categorias.html';
    }
  </script>
</body>
</html>
